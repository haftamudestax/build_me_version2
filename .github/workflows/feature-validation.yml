name: Feature Branch Validation

on:
  push:
    branches:
      - "feature/**"

concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @about-me/web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm turbo run lint

      #################################################################
      # Debug TypeCheck
      #################################################################

      - name: Debug - Git Information
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          git log --oneline -1

      - name: Debug - Working Directory
        run: |
          pwd
          ls -la

      - name: Debug - Turbo Version
        run: pnpm turbo --version

      - name: Debug - Node & PNPM
        run: |
          node --version
          pnpm --version

      - name: Debug - turbo.json
        run: cat turbo.json

      - name: Debug - Root package.json
        run: cat package.json

      - name: Debug - Search for typecheck in turbo.json
        run: grep -n "typecheck" turbo.json || true

      - name: Debug - Workspace Packages
        run: pnpm turbo ls

      - name: Debug - Root Scripts
        run: pnpm run

      #################################################################

      - name: Type Check
        run: pnpm turbo run typecheck

      - name: Run Tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Dependencies (fails on high/critical vulnerabilities)
        run: pnpm audit --audit-level=high

  code-scanning:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
